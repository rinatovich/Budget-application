name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Accept Android SDK Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

    - name: Build Android APK
      run: |
        if [ -f "./gradlew" ] && [ -d "./app" ]; then
          echo "--> Found native Kotlin project in root. Building..."
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
        else
          echo "--> Packaging Web App into Android APK via Capacitor..."
          npm install --legacy-peer-deps
          npm run build
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          echo '{"appId":"com.budget.app","appName":"Бюджет План","webDir":"dist"}' > capacitor.config.json
          rm -f capacitor.config.ts
          npx cap add android || true
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: budget-app-debug
        path: |
          app/build/outputs/apk/debug/*.apk
          android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
